name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned runner image: ubuntu-latest moves to a new major release on its own schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Real PostgreSQL: without it the storage tests (JSONB, ARRAY, ENUM, Alembic
    # migrations) are skipped instead of run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parmangal_test
          POSTGRES_PASSWORD: parmangal_test
          POSTGRES_DB: parmangal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parmangal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://parmangal_test:parmangal_test@127.0.0.1:5432/parmangal_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      # -rs prints skip reasons: a skipped test should never be invisible.
      - run: python -m pytest -q -p no:cacheprovider --timeout=120 -rs
